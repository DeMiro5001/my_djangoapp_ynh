    # Gunicorn proxy
    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_pass http://unix:/__INSTALL_DIR__/gunicorn.sock;
        
        # Timeouts
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;

        client_max_body_size 10G;
    }

    # Static files
    location /static/ {
        alias __INSTALL_DIR__/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media files
    location /media/ {
        alias __INSTALL_DIR__/media/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        internal;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive files
    location ~ ^/(\.env|\.git|\.ht|README\.md|requirements\.txt|manage\.py) {
        deny all;
        access_log off;
        log_not_found off;
    }